openapi: 3.0.0
info:
  title: The Story Sail API
  version: 1.0.0
  description: API documentation for The Story Sail blog app

paths:
  /api/posts:
    get:
      summary: Retrieve a list of all blog posts
      responses:
        "200":
          description: List of blog posts
          content:
            application/json:
              example: |
                [
                  {
                    "id": 1,
                    "title": "Sample Title",
                    "content": "Lorem ipsum dolor sit amet...",
                    "created_at": "2023-08-04T12:34:56Z"
                  },
                  // ... more blog posts ...
                ]
    post:
      summary: Create a new blog post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
              required:
                - title
                - content
      responses:
        "201":
          description: Blog post created successfully
        "400":
          description: Bad request, missing or invalid fields

  /api/posts/{id}:
    get:
      summary: Retrieve a single blog post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Blog post details
          content:
            application/json:
              example: |
                {
                  "id": 1,
                  "title": "Sample Title",
                  "content": "Lorem ipsum dolor sit amet...",
                  "created_at": "2023-08-04T12:34:56Z"
                }
        "404":
          description: Blog post not found
    put:
      summary: Update an existing blog post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
              required:
                - title
                - content
      responses:
        "200":
          description: Blog post updated successfully
        "404":
          description: Blog post not found
        "400":
          description: Bad request, missing or invalid fields
    delete:
      summary: Delete a blog post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Blog post deleted successfully
        "404":
          description: Blog post not found
